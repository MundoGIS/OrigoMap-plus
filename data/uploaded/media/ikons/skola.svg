<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 64 64">
  <!-- Edificio principal -->
  <rect x="8" y="24" width="48" height="32" fill="#4B79A1" stroke="#2C3E50" stroke-width="2"/>
  <!-- Tejado -->
  <polygon points="8,24 32,4 56,24" fill="#2C3E50"/>
  <!-- Reloj -->
  <circle cx="32" cy="16" r="6" fill="#EAECEE" stroke="#2C3E50" stroke-width="1"/>
  <line x1="32" y1="16" x2="32" y2="12" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="32" y1="16" x2="36" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
  <!-- Puerta -->
  <rect x="28" y="40" width="8" height="16" fill="#EAECEE" stroke="#2C3E50" stroke-width="1"/>
  <!-- Ventanas -->
  <g fill="#EAECEE" stroke="#2C3E50" stroke-width="1">
    <rect x="16" y="32" width="8" height="8"/>
    <rect x="40" y="32" width="8" height="8"/>
    <rect x="16" y="48" width="8" height="8"/>
    <rect x="40" y="48" width="8" height="8"/>
  </g>
  <!-- Bandera -->
  <rect x="30" y="4" width="4" height="20" fill="#2C3E50"/>
  <polygon points="34,4 34,10 42,7" fill="#E74C3C" stroke="#2C3E50" stroke-width="1"/>
</svg>
