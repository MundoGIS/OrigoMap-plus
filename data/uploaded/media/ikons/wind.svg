<svg width="100" height="100" viewBox="0 0 100 100" 
     xmlns="http://www.w3.org/2000/svg">
  <!-- Hub central -->
  <circle cx="50" cy="50" r="4" fill="currentColor" />
  <!-- Palas del rotor -->
  <g fill="currentColor">
    <!-- Pala superior -->
    <rect x="47" y="10" width="6" height="40" rx="2" ry="2" transform="rotate(0 50 50)" />
    <!-- Pala inferior derecha -->
    <rect x="47" y="10" width="6" height="40" rx="2" ry="2" transform="rotate(120 50 50)" />
    <!-- Pala inferior izquierda -->
    <rect x="47" y="10" width="6" height="40" rx="2" ry="2" transform="rotate(240 50 50)" />
  </g>
</svg>
