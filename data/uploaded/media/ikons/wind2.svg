<svg width="100" height="100" viewBox="0 0 100 100" 
     xmlns="http://www.w3.org/2000/svg">
  <!-- Hub central -->
  <circle cx="50" cy="50" r="4" fill="currentColor" />
  <!-- Grupo de palas -->
  <g fill="currentColor">
    <!-- Pala 1 -->
    <path d="M50,50 
             C47,35 47,20 48,15 
             Q50,10 52,15 
             C55,20 55,35 50,50 Z" 
          transform="rotate(0,50,50)" />
    <!-- Pala 2 -->
    <path d="M50,50 
             C47,35 47,20 48,15 
             Q50,10 52,15 
             C55,20 55,35 50,50 Z" 
          transform="rotate(120,50,50)" />
    <!-- Pala 3 -->
    <path d="M50,50 
             C47,35 47,20 48,15 
             Q50,10 52,15 
             C55,20 55,35 50,50 Z" 
          transform="rotate(240,50,50)" />
  </g>
</svg>
